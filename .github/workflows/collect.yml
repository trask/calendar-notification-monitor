name: Collect public calendar

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-calendar-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: code
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        working-directory: code
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Restore complete data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data
          fetch-depth: 0
      - name: Collect anonymous structural evidence
        id: capture
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -m calendar_notification_monitor collect \
            --data-dir "$GITHUB_WORKSPACE/data" \
            --manifest "$RUNNER_TEMP/calendar-outputs.json" \
            --code-revision "$(git -C code rev-parse HEAD)" \
            --baseline-commit "$(git -C data rev-parse HEAD)" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
      - name: Publish named outputs, including failed observations
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        run: |
          if [ ! -f "$RUNNER_TEMP/calendar-outputs.json" ]; then
            echo "No valid output manifest; nothing published." >&2
            exit 1
          fi
          python -m calendar_notification_monitor publish \
            --data-dir "$GITHUB_WORKSPACE/data" \
            --manifest "$RUNNER_TEMP/calendar-outputs.json"
      - name: Run summary
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          printf 'Capture step: %s\n\n[Sanitized data branch](https://github.com/trask/calendar-notification-monitor/tree/data)\n' \
            "$CAPTURE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
